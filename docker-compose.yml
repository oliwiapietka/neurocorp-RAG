version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neurocorp-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: always

  mongo:
    image: mongo:latest
    container_name: neurocorp-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo_data:/data/db
    restart: always

  mongo-express:
    image: mongo-express
    container_name: neurocorp-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
    depends_on:
      - mongo
